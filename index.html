<style id="v04-style">

<main class="app" id="app"></main><script src="questions/term2.js"></script><script>
(function(){
const BANK=window.G3ScienceTerm2Questions; if(!Array.isArray(BANK)||BANK.length!==105){document.getElementById('app').innerHTML='<div class="card center"><h2>Question bank failed to load.</h2><p>Please reopen the extracted game folder.</p></div>';return;}
const missions=[['Living and Non-Living','🌱','The Living Things Garden'],['Animal and Plant Parts','🐾','Amazing Body Parts'],['Basic Needs and Environment','💧','The Needs of Life Village'],['Movement: Pushes, Pulls, and Causes','💨','Motion Mountain'],['Position and Change in Position','📍','The Moving World']];
const KEY='g3_science_adventure_v032';let s=JSON.parse(localStorage.getItem(KEY)||'null')||{unlocked:1,completed:{},stars:0,correct:0,answered:0};
function save(){localStorage.setItem(KEY,JSON.stringify(s))} function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function map(){const pct=Math.round(Object.keys(s.completed).length/5*100);document.getElementById('app').innerHTML=`<section class="card hero"><div class="explorer">🧑‍🔬</div><h1>Science Adventure</h1><p class="muted">Explore, discover, and become a Science Explorer!</p><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="stats"><span class="pill">⭐ ${s.stars} Stars</span><span class="pill">✅ ${s.correct} Correct</span><span class="pill">🗺️ ${Object.keys(s.completed).length}/5 Missions</span></div></section><section class="map">${missions.map((m,i)=>{let n=i+1,c=s.completed[n],lock=n>s.unlocked;return `<button class="mission ${c?'done':''}" ${lock?'disabled':''} data-n="${n}"><div class="icon">${m[1]}</div><div class="num">MISSION ${n}</div><b>${m[2]}</b><div>${lock?'🔒 Locked':c?'⭐'.repeat(c.stars)+' '+c.stars+'/3':'🚀 Start'}</div></button>`}).join('')}</section><div class="fact"><b>🔬 Science Explorer Tip:</b> Observe carefully, think about the evidence, and try again when you make a mistake.</div>`;document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>play(+b.dataset.n))}
function play(n){const m=missions[n-1];let qs=BANK.filter(q=>q.topic===m[0]).sort(()=>Math.random()-.5).slice(0,3);if(qs.length!==3){alert('This mission has a question-bank problem.');return}let i=0,correct=0,answered=0,lives=3;render();
function render(){let q=qs[i];document.getElementById('app').innerHTML=`<button class="btn secondary" id="back">← Adventure Map</button><section class="card qhead" style="margin-top:12px"><div style="font-size:42px">${m[1]}</div><h2>Mission ${n}: ${m[2]}</h2><div>❤️ ${lives} &nbsp; | &nbsp; Question ${i+1} of 3</div></section><section class="card qcard"><div class="muted">${esc(q.level)} • ${esc(q.topic)}</div><h2>${esc(q.question)}</h2><div id="choices"></div><div id="fb"></div></section>`;document.getElementById('back').onclick=map;q.choices.forEach((choice,idx)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+idx)+'. '+choice;b.onclick=()=>answer(idx,b);document.getElementById('choices').appendChild(b)})}
function answer(idx,clicked){let q=qs[i];document.querySelectorAll('.choice').forEach(b=>b.disabled=true);answered++;let ok=idx===q.answer;if(ok)correct++;else lives--;let fb=document.getElementById('fb');fb.className='feedback '+(ok?'good':'bad');fb.innerHTML=`<b>${ok?'🎉 Correct!':'💡 Not quite!'}</b><br>${!ok?'Correct answer: <b>'+String.fromCharCode(65+q.answer)+'</b><br>':''}${esc(q.rationale)}<br><button class="btn primary" id="next" style="margin-top:10px">${i===2||lives===0?'Finish Mission':'Next Question →'}</button>`;document.getElementById('next').onclick=()=>{if(i===2||lives===0)finish();else{i++;render()}}}
function finish(){let pct=correct/answered,stars=pct>=.9?3:pct>=.7?2:1;s.completed[n]={stars,correct,answered};s.unlocked=Math.max(s.unlocked,Math.min(5,n+1));s.stars=Object.values(s.completed).reduce((a,x)=>a+x.stars,0);s.correct=Object.values(s.completed).reduce((a,x)=>a+x.correct,0);s.answered=Object.values(s.completed).reduce((a,x)=>a+x.answered,0);save();document.getElementById('app').innerHTML=`<section class="card center"><div style="font-size:56px">${m[1]}</div><h1>Mission ${n} Complete!</h1><div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><p><b>${correct}/${answered}</b> correct</p><p>${stars===3?'🏆 Outstanding, Science Explorer!':stars===2?'🌟 Great work!':'🌱 Good effort! Replay to improve your stars.'}</p><button class="btn primary" id="again">🔄 Replay Mission</button> <button class="btn secondary" id="home">🗺️ Adventure Map</button></section>`;document.getElementById('again').onclick=()=>play(n);document.getElementById('home').onclick=map}}
map();})();</script>
<script id="v04-visual-layer">
(function(){
  const missions=[
    {title:"The Living Things Garden",icon:"🌱",badge:"Living Things Detective",color:"#e9f8df"},
    {title:"Amazing Body Parts",icon:"🐾",badge:"Body Parts Explorer",color:"#fff2d8"},
    {title:"The Needs of Life Village",icon:"💧",badge:"Life Needs Guardian",color:"#e4f5ff"},
    {title:"Motion Mountain",icon:"💨",badge:"Motion Master",color:"#edf0ff"},
    {title:"The Moving World",icon:"📍",badge:"Position Pathfinder",color:"#fff0f4"}
  ];
  const key="g3_science_adventure_v04";
  let state=JSON.parse(localStorage.getItem(key)||"null")||{unlocked:1,completed:{},stars:0,correct:0,answered:0};
  function save(){localStorage.setItem(key,JSON.stringify(state))}
  function bank(){return window.G3ScienceTerm2Questions||[]}
  function topicQuestions(i){
    const terms=["Living and Non-Living","Animal and Plant Parts","Basic Needs and Environment","Movement: Pushes, Pulls, and Causes","Position and Change in Position"];
    const t=terms[i-1].toLowerCase();
    return bank().filter(q=>String(q.topic||"").toLowerCase().includes(t.split(" ")[0]) || String(q.topic||"").toLowerCase()===t);
  }
  function badgeList(){
    return missions.map((m,i)=>state.completed[i+1]?`<span class="v04-earned">🏅 ${m.badge}</span>`:"").filter(Boolean).join("");
  }
  function map(){
    const old=document.getElementById("v03Adventure"); if(old) old.remove();
    document.body.querySelectorAll("main").forEach((m,i)=>{if(i>0)m.remove()});
    const main=document.querySelector("main")||document.body.appendChild(document.createElement("main"));
    main.innerHTML="";
    const wrap=document.createElement("div"); wrap.className="v04-wrap";
    const pct=Math.round(Object.keys(state.completed).length/5*100);
    wrap.innerHTML=`
      <section class="v04-hero">
        <div class="v04-explorer">🧑‍🔬</div>
        <h1>Science Adventure</h1>
        <p>Explore • Discover • Learn</p>
        <div class="v04-progress"><div class="v04-fill" style="width:${pct}%"></div></div>
        <div class="v04-stats">
          <span class="v04-pill">⭐ ${state.stars} Stars</span>
          <span class="v04-pill">🔬 ${state.correct} Correct</span>
          <span class="v04-pill">🗺️ ${Object.keys(state.completed).length}/5 Missions</span>
        </div>
      </section>
      <h2 class="v04-section-title">🗺️ Choose Your Adventure</h2>
      <section class="v04-map">
        ${missions.map((m,i)=>{
          const n=i+1,c=state.completed[n],locked=n>state.unlocked;
          return `<button class="v04-card ${c?'done':''}" data-n="${n}" ${locked?'disabled':''} style="background:${c?m.color:'#fff'}">
            <div class="scene">${m.icon}</div><div class="v04-num">MISSION ${n}</div>
            <h3>${m.title}</h3>
            <div class="v04-status">${locked?'🔒 Locked':c?'⭐'.repeat(c.stars)+' '+c.stars+'/3 Stars':'🚀 Begin Mission'}</div>
            ${c?`<div class="v04-badge">🏅 ${m.badge}</div>`:""}
          </button>`;
        }).join("")}
      </section>
      <div class="v04-tip"><strong>🔬 Science Explorer Tip:</strong> Scientists observe carefully, ask questions, and learn from mistakes. Keep exploring!</div>
      <div class="v04-badges">${badgeList()||'<span class="v04-earned">🏅 Complete missions to collect badges!</span>'}</div>
    `;
    main.appendChild(wrap);
    wrap.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>play(+b.dataset.n));
  }

  function play(n){
    const m=missions[n-1],qs=[...topicQuestions(n)].sort(()=>Math.random()-.5).slice(0,3);
    if(qs.length<3){alert("This mission does not have enough questions loaded.");return}
    let idx=0,correct=0,answered=0,lives=3;
    const main=document.querySelector("main"); main.innerHTML="";
    const wrap=document.createElement("div");wrap.className="v04-wrap";main.appendChild(wrap);
    function render(){
      const q=qs[idx], choices=q.choices||[];
      wrap.innerHTML=`
        <button class="v04-back" id="back">← Adventure Map</button>
        <section class="v04-game-head"><div class="v04-mission-icon">${m.icon}</div><h2>Mission ${n}: ${m.title}</h2>
        <div>❤️ ${lives} &nbsp; • &nbsp; Question ${idx+1} of 3</div></section>
        <section class="v04-complete" style="text-align:left">
          <div style="font-size:12px;font-weight:800;color:#728596">${q.difficulty||"SCIENCE EXPLORER"}</div>
          <h3>${q.question}</h3>
          <div id="choices"></div><div id="fb"></div>
        </section>`;
      document.getElementById("back").onclick=map;
      const c=document.getElementById("choices");
      choices.forEach((txt,j)=>{
        const b=document.createElement("button");b.className="v04-action";b.style.cssText+="display:block;width:100%;text-align:left;background:#fff;border:1px solid #d5e1e8;margin:8px 0";b.textContent=String.fromCharCode(65+j)+". "+txt;
        b.onclick=()=>answer(j,b,q,c);c.appendChild(b);
      });
    }
    function answer(j,btn,q,c){
      [...c.children].forEach(b=>b.disabled=true);
      answered++;
      const right=Number(q.answer)===j || String(q.correct_answer||"").toUpperCase()===String.fromCharCode(65+j);
      if(right)correct++;else lives--;
      const fb=document.getElementById("fb");
      fb.innerHTML=`<div style="margin-top:14px;padding:14px;border-radius:14px;background:${right?'#eaf8e8':'#fff0f0'}"><strong>${right?'🎉 Correct!':'💡 Keep exploring!'}</strong><br>${q.rationale||''}</div>`;
      const next=document.createElement("button");next.className="v04-action";next.style.background="#3d7f5b";next.style.color="#fff";next.textContent=(idx===2||lives===0)?"Finish Mission":"Next Question →";
      next.onclick=()=>{if(idx===2||lives===0)finish();else{idx++;render()}};fb.appendChild(next);
    }
    function finish(){
      const stars=correct/answered>=.9?3:correct/answered>=.7?2:1;
      state.completed[n]={stars,correct,answered};state.unlocked=Math.max(state.unlocked,Math.min(5,n+1));
      state.stars=Object.values(state.completed).reduce((s,x)=>s+x.stars,0);
      state.correct=Object.values(state.completed).reduce((s,x)=>s+x.correct,0);
      state.answered=Object.values(state.completed).reduce((s,x)=>s+x.answered,0);save();
      wrap.innerHTML=`<button class="v04-back" id="map">← Adventure Map</button>
      <section class="v04-complete"><div class="v04-badge-big">${m.icon}</div><h2>Mission Complete! 🎉</h2>
      <div class="v04-stars">${"⭐".repeat(stars)}${"☆".repeat(3-stars)}</div>
      <h3>${m.badge} Badge Unlocked!</h3><p><strong>${correct}/${answered}</strong> correct</p>
      <p>${stars===3?"Amazing work, Science Explorer!":stars===2?"Great work! Keep exploring!":"Good effort! Replay the mission to improve your stars."}</p>
      <button class="v04-action" id="again" style="background:#e5f3ff">🔄 Replay Mission</button></section>`;
      document.getElementById("map").onclick=map;document.getElementById("again").onclick=()=>play(n);
    }
    render();
  }
  // v0.4 takes over the presentation but keeps the tested data source.
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",map);else map();
})();
</script>

<script id="v06-profile">
(function(){
  const missions=[
    ["🌱","Living Things Detective"],["🐾","Body Parts Explorer"],
    ["💧","Life Needs Guardian"],["💨","Motion Master"],["📍","Position Pathfinder"]
  ];
  const key="g3_science_adventure_v04";
  function read(){
    try{return JSON.parse(localStorage.getItem(key)||"null")||{completed:{},stars:0,correct:0,answered:0}}
    catch(e){return {completed:{},stars:0,correct:0,answered:0}}
  }
  function profileHTML(){
    const s=read(), done=Object.keys(s.completed).length;
    const accuracy=s.answered?Math.round(s.correct/s.answered*100):0;
    return `<section class="v06-profile">
      <h2>🧑‍🔬 My Science Explorer Profile</h2>
      <div class="v06-statgrid">
        <div class="v06-stat"><strong>${done}/5</strong><span>Missions Completed</span></div>
        <div class="v06-stat"><strong>⭐ ${s.stars||0}</strong><span>Total Stars</span></div>
        <div class="v06-stat"><strong>${s.correct||0}</strong><span>Correct Answers</span></div>
        <div class="v06-stat"><strong>${accuracy}%</strong><span>Accuracy</span></div>
      </div>
      <div style="text-align:center;margin-top:18px;font-weight:800">🏅 Badge Collection</div>
      <div class="v06-badges">${missions.map((m,i)=>{
        const e=s.completed[i+1];
        return `<div class="v06-badge ${e?'earned':''}"><span class="icon">${e?m[0]:"🔒"}</span><strong>${m[1]}</strong><br><span>${e?"Earned":"Locked"}</span></div>`;
      }).join("")}</div>
      ${done===5?`<div class="v06-cert"><div class="trophy">🏆</div><h3>Certified Science Explorer!</h3><p>You completed all five Second Term Science Adventures.</p><strong>⭐ ${s.stars} Stars • ${accuracy}% Accuracy</strong><p style="font-size:12px;color:#66798a">Keep observing, asking questions, and exploring!</p></div>`:""}
      <button class="v06-reset" id="v06Reset">Reset Adventure Progress</button>
    </section>`;
  }
  function inject(){
    const wrap=document.querySelector(".v04-wrap");
    if(!wrap||wrap.querySelector(".v06-profile"))return;
    wrap.insertAdjacentHTML("beforeend",profileHTML());
    const b=document.getElementById("v06Reset");
    if(b)b.onclick=()=>{
      if(confirm("Reset all Science Adventure progress?")){
        localStorage.removeItem(key); location.reload();
      }
    };
  }
  const observer=new MutationObserver(()=>setTimeout(inject,30));
  function start(){observer.observe(document.body,{childList:true,subtree:true});inject();}
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start();
})();
</script>

<script id="v07-randomize-answers">
(function(){
  // Randomize answer positions without changing the underlying question bank.
  // The displayed correct position is calculated from the shuffled choices.
  const originalBank = window.G3ScienceTerm2Questions;
  if(!Array.isArray(originalBank)) return;

  // Build a private randomized copy. Each question receives a shuffled
  // choices array plus an internal correct index.
  window.G3ScienceTerm2Questions = originalBank.map(function(q){
    const choices = Array.isArray(q.choices) ? q.choices.slice() : [];
    const originalAnswer = Number(q.answer);
    const order = choices.map((_,i)=>i);

    for(let i=order.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [order[i],order[j]]=[order[j],order[i]];
    }

    const shuffled=order.map(i=>choices[i]);
    const correctIndex=order.indexOf(originalAnswer);

    return Object.assign({},q,{
      choices:shuffled,
      answer:correctIndex
    });
  });

  // The tested engine already reads q.choices and q.answer, so no other
  // game logic needs to change.
  window.G3ScienceAnswerPositionsRandomized = true;
})();
</script>
